# =============================================================================
# OpenMAIC Nginx 反向代理配置
# 部署位置：/etc/nginx/conf.d/openmaic.conf
# 占位符（部署脚本会自动替换）：
#   ai2learn.xyz      → 你的域名，例如 teaching.example.com
# 注意：HTTPS 证书由 deploy.sh 调用 certbot 自动申请并注入此文件
# =============================================================================

# HTTP → HTTPS 跳转 + Let's Encrypt 证书验证
server {
    listen 80;
    listen [::]:80;
    server_name ai2learn.xyz;

    # certbot webroot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai2learn.xyz;

    # 证书路径（certbot 申请后自动填充，下面是默认 certbot 路径）
    ssl_certificate     /etc/letsencrypt/live/ai2learn.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai2learn.xyz/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 允许同源嵌入（教学 iframe 等场景）
    add_header Content-Security-Policy "frame-ancestors 'self';" always;

    # 上传体积：教学资源/PDF 解析可能较大，给到 200m（与 next.config 一致）
    client_max_body_size 200m;

    # 反向代理到 Docker 容器（仅监听本机回环）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Next.js 需要 Upgrade 头（HMR/WebSocket，生产主要用于流式响应）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（AI 问答 SSE）禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js 静态资源长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
