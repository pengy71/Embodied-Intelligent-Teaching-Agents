# =============================================================================
# OpenMAIC Nginx 反向代理 - HTTP 基础配置
# 部署位置：/etc/nginx/conf.d/openmaic.conf
# 说明：此为 HTTP-only 基础配置，certbot --nginx 会自动追加 443 SSL 块
#       并将 80 端口改为 HTTP→HTTPS 跳转。
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ai2learn.xyz;

    # 上传体积：教学资源/PDF 解析可能较大，与 next.config 一致
    client_max_body_size 200m;

    # 反向代理到 Docker 容器（仅监听本机回环）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Next.js 需要 Upgrade 头（HMR/WebSocket，生产主要用于流式响应）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（AI 问答 SSE）禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js 静态资源长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
