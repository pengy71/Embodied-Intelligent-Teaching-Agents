# =============================================================================
# 生产部署用 docker-compose（精简版）
# - 仅启动 openmaic 应用（数据库用 Supabase 云库，无需本地 postgres）
# - 移除 render-service（视频导出，4G 服务器跑不动且非必需）
# - 通过宿主机 Nginx 反向代理 + HTTPS 对外暴露
# 用法：docker compose -f deploy/docker-compose.prod.yml up -d --build
# =============================================================================
services:
  openmaic:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # 教学功能客户端开关（编译进浏览器包，按需开启）
        - NEXT_PUBLIC_PERSISTENCE=${NEXT_PUBLIC_PERSISTENCE:-}
        - NEXT_PUBLIC_PERSISTENCE_TOKEN=${NEXT_PUBLIC_PERSISTENCE_TOKEN:-}
        - NEXT_PUBLIC_TEACHING_ENABLED=true
    container_name: openmaic-app
    ports:
      # 仅监听本机回环，由宿主机 Nginx 反代；如不需 Nginx 可改成 "0.0.0.0:3000:3000"
      - "127.0.0.1:3000:3000"
    env_file:
      - ../.env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      # 持久化运行时数据（上传的教材、缓存等）
      - openmaic-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openmaic-data:
